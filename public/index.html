<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collytex Home</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2a;
        --card: #182338;
        --text: #edf4ff;
        --muted: #a7b7d4;
        --brand: #7cc7ff;
        --accent: #89f0c3;
        --shadow: rgba(13, 18, 30, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #152748 0%, var(--bg) 46%, #090d18 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .shell {
        width: min(960px, 90vw);
        background: rgba(20, 31, 48, 0.82);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        box-shadow: 0 25px 70px var(--shadow);
        padding: 40px 28px;
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(124, 199, 255, 0.12);
        border: 1px solid rgba(124, 199, 255, 0.25);
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 1.02;
        margin: 18px 0 16px;
      }

      .sub {
        margin: 0 0 28px;
        max-width: 620px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 20px;
      }

      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary {
        background: linear-gradient(135deg, var(--brand), #6ca1ff);
        color: #06131d;
        box-shadow: 0 16px 40px rgba(108, 161, 255, 0.35);
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
      }

      .primary:hover,
      .secondary:hover {
        transform: translateY(-1px);
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 18px;
        margin-top: 40px;
      }

      .stat {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 18px 16px;
      }

      .stat strong {
        display: block;
        font-size: 1.6rem;
        margin-bottom: 8px;
      }

      .stat span {
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .shell { padding: 28px 18px; }
        .meta { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <span class="badge">Collytex</span>
      <h1>Find your perfect campus.</h1>
      <p class="sub">
        Explore verified colleges, compare courses, check admissions, and discover the best fit for your future in one clean experience.
      </p>

      <div class="actions">
        <a class="primary" href="/">Open the app</a>
        <a class="secondary" href="/">Explore colleges</a>
      </div>

      <div class="meta">
        <div class="stat">
          <strong>1200+</strong>
          <span>Verified colleges</span>
        </div>
        <div class="stat">
          <strong>800+</strong>
          <span>Courses tracked</span>
        </div>
        <div class="stat">
          <strong>4.8/5</strong>
          <span>Student experience</span>
        </div>
      </div>
    </main>
  </body>
</html>
